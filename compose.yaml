name: chinese-chess-web-dev
services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: chinese_chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess_local_dev
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chess", "-d", "chinese_chess"]
      interval: 3s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
